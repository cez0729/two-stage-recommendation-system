name: recsys-ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Offline parity smoke when frozen artifacts are present
        shell: bash
        run: |
          if [[ -f models/video_games_2018/two_tower_v3_logq.pt && -f artifacts/video_games_2018/faiss/item_flat.index ]]; then
            python scripts/check_serving_parity.py --users 20
          else
            echo "Frozen model/data artifacts are not tracked in CI; parity smoke skipped."
          fi
      - name: Lint
        run: python -m ruff check src tests scripts

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build serving image
        run: docker build -t two-stage-recsys:ci .
