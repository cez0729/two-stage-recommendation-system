project_seed: 42

dataset:
  name: amazon_reviews_2023
  category: All_Beauty
  review_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/review_categories/All_Beauty.jsonl.gz
  metadata_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/meta_categories/meta_All_Beauty.jsonl.gz
  review_filename: All_Beauty.jsonl.gz
  metadata_filename: meta_All_Beauty.jsonl.gz
  review_schema:
    user_id: user_id
    item_id: parent_asin
    timestamp: timestamp
    rating: rating
    timestamp_unit: ms
  metadata_schema:
    item_id: parent_asin
    title: title
    category: main_category
    price: price
    avg_rating: average_rating
    rating_number: rating_number
  min_rating: 3.0
  deduplicate_user_item: true
  min_user_interactions: 5
  min_item_interactions: 5
  max_interactions: 1500000

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  artifacts_dir: artifacts

