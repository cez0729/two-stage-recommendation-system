{
  "project_seed": 42,
  "dataset": {
    "name": "amazon_reviews_2018_5core",
    "category": "Musical_Instruments",
    "review_url": "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/categoryFilesSmall/Musical_Instruments_5.json.gz",
    "metadata_url": "https://mcauleylab.ucsd.edu/public_datasets/data/amazon_v2/metaFiles2/meta_Musical_Instruments.json.gz",
    "review_filename": "Musical_Instruments_5.json.gz",
    "metadata_filename": "meta_Musical_Instruments.json.gz",
    "review_schema": {
      "user_id": "reviewerID",
      "item_id": "asin",
      "timestamp": "unixReviewTime",
      "rating": "overall",
      "timestamp_unit": "s"
    },
    "metadata_schema": {
      "item_id": "asin",
      "title": "title",
      "category": "main_cat",
      "price": "price",
      "avg_rating": null,
      "rating_number": null
    },
    "min_rating": 3,
    "deduplicate_user_item": true,
    "min_user_interactions": 5,
    "min_item_interactions": 5,
    "max_interactions": 1500000
  },
  "paths": {
    "raw_dir": "data/raw/musical_instruments_2018",
    "interim_dir": "data/interim/musical_instruments_2018",
    "processed_dir": "data/processed/musical_instruments_2018",
    "artifacts_dir": "artifacts/musical_instruments_2018"
  },
  "split": {
    "same_timestamp_policy": "select_one_per_target_timestamp"
  }
}
