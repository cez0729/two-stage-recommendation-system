[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-recsys"
version = "0.1.0"
description = "A reproducible two-stage e-commerce recommendation system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.115,<1",
    "faiss-cpu>=1.8,<2",
    "lightgbm>=4.3,<5",
    "pandas>=2.1",
    "pyarrow>=14",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "redis>=5.0,<6",
    "requests>=2.31,<3",
    "scikit-learn>=1.4,<2",
    "torch>=2.2",
    "typer>=0.12",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
